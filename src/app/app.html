<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-8">
      <div class="bg-white rounded-4 shadow-sm p-4 p-md-5">
        <h1 class="mb-4 text-center"><i class="bi bi-journal-check me-2"></i>Todo App</h1>

        @if (formOpen()) {
          <div class="card mb-4">
            <div class="card-body">
              <input
                class="form-control mb-2"
                placeholder="Task title..."
                [(ngModel)]="title"
                (keyup.enter)="add()"
              />
              <textarea
                class="form-control"
                rows="2"
                placeholder="Description (optional)..."
                [(ngModel)]="description"
              ></textarea>
            </div>
            <div class="card-footer bg-transparent d-flex gap-2">
              <button
                class="btn btn-primary flex-grow-1"
                [disabled]="!title.trim()"
                (click)="add()"
              >
                <i class="bi bi-plus-lg me-1"></i>Add Task
              </button>
              <button class="btn btn-outline-secondary" (click)="closeForm()">
                <i class="bi bi-x-lg me-1"></i>Cancel
              </button>
            </div>
          </div>
        } @else {
          <button class="btn btn-primary w-100 mb-4" (click)="openForm()">
            <i class="bi bi-plus-lg me-1"></i>Add Task
          </button>
        }

        <div class="row row-cols-1 row-cols-md-2 g-3">
          @for (task of tasks(); track task.id) {
            <app-task-item
              [task]="task"
              (save)="update(task.id, $event)"
              (remove)="requestDelete(task)"
            />
          } @empty {
            <div class="w-100 text-center text-muted py-5">
              <i class="bi bi-inbox fs-1 d-block mb-2"></i>
              No tasks yet.
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</main>

@if (pendingDelete(); as task) {
  <div
    class="modal d-block"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-title"
    (click)="cancelDelete()"
  >
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="delete-title">Delete task?</h5>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="cancelDelete()"
          ></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete <strong>{{ task.title }}</strong
          >? This can't be undone.
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" (click)="cancelDelete()">Cancel</button>
          <button class="btn btn-danger" (click)="confirmDelete()">
            <i class="bi bi-trash me-1"></i>Delete
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop show"></div>
}

@if (toastMessage(); as message) {
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <div
      class="toast show align-items-center text-bg-success border-0"
      role="status"
      aria-live="polite"
    >
      <div class="d-flex">
        <div class="toast-body"><i class="bi bi-check-circle me-2"></i>{{ message }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="dismissToast()"
        ></button>
      </div>
    </div>
  </div>
}
