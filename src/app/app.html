<div class="container my-5" style="max-width: 600px">
  <h1 class="mb-4 text-center">Todo App</h1>

  <div class="mb-3">
    <input class="form-control mb-2" placeholder="Task title..." [(ngModel)]="newTitle" (keyup.enter)="add()" />
    <textarea class="form-control mb-2" rows="2" placeholder="Description (optional)..."
      [(ngModel)]="newDescription"></textarea>
    <button class="btn btn-primary w-100" (click)="add()">Add Task</button>
  </div>

  <ul class="list-group">
    @for (task of tasks; track task.id) {
    <app-task-item [task]="task" (save)="update(task.id, $event)" (remove)="delete(task.id)" />
    } @empty {
    <li class="list-group-item text-muted text-center">No tasks yet.</li>
    }
  </ul>
</div>
