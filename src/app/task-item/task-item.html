<li class="list-group-item">
    @if (editing) {
    <input class="form-control mb-2" placeholder="Title" [(ngModel)]="draftTitle" />
    <textarea class="form-control mb-2" rows="2" placeholder="Description" [(ngModel)]="draftDescription"></textarea>
    <button class="btn btn-success btn-sm me-2" (click)="confirm()">Save</button>
    <button class="btn btn-secondary btn-sm" (click)="editing = false">Cancel</button>
    } @else {
    <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
            <div class="fw-semibold">{{ task.title }}</div>
            @if (task.description) {
            <div class="text-muted small">{{ task.description }}</div>
            }
        </div>
        <div class="text-nowrap">
            <button class="btn btn-outline-primary btn-sm me-1" (click)="startEdit()">Edit</button>
            <button class="btn btn-outline-danger btn-sm" (click)="remove.emit()">Delete</button>
        </div>
    </div>
    }
</li>
